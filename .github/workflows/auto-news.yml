name: Auto news

on:
  schedule:
    - cron: "30 0,3,6,9,12,15 * * *"   # every 3 hours, 6 AM - 9 PM IST
    - cron: "30 18 * * *"               # midnight IST: housekeeping
  workflow_dispatch:
    inputs:
      mode:
        description: "collect (log only) | draft (always save as held) | run (normal)"
        default: run

concurrency: auto-news

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
            npm run pipeline:housekeeping
          else
            npm run pipeline -- --mode=${{ github.event.inputs.mode || 'run' }}
          fi
